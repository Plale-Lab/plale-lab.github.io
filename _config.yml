# ============================================================
# STEP 1: Your Identity (required)
# ============================================================
name: "Beth Plale"
title: "Executive Director, School of Computer and Data Sciences"
institution: "University of Oregon"
email: plalelab@uoregon.edu

# ============================================================
# STEP 2: Your Links (optional -- delete any you don't use)
# ============================================================
links:
  google_scholar: "https://scholar.google.com/citations?user=CyGvFJkAAAAJ"
  github: "https://github.com/plale-lab"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""  # e.g., "papers/cv.pdf" — leave blank to hide the CV icon

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#2E9C93"      # PlaleLab brand teal (from logos/)
description: "Plale Lab — Traceable Intelligence. Data and Information Management in AI, University of Oregon"
baseurl: ""
url: "https://plale-lab.github.io"

# Lab-level branding (separate from the PI identity above, used in the
# navbar brand and page title so the site reads as the lab's, not the PI's).
lab_name: "Plale Lab"
lab_tagline: "Traceable Intelligence"

# Google Analytics — paste your GA4 measurement ID, or leave blank
analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: team
  - name: publications
  # - name: talks        # not used for this lab site
  # - name: teaching     # not used for this lab site
  # - name: blogs        # not used for this lab site

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Plale
  first_name: [Beth]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
