<nav class="navbar sticky-top navbar-expand-md">
  <div class="container" style="max-width: var(--container-max);">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/images/brand/plalelab-icon.svg' | relative_url }}" width="28" height="28" class="navbar-brand-mark" alt="">
      <span class="navbar-brand-copy">
        <strong>{{ site.lab_name | default: site.name | escape }}</strong>
        <small>{{ site.lab_tagline }}</small>
      </span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        </li>
        {% for nav in site.nav_pages %}
        <li class="nav-item">
          <a class="nav-link{% if page.url == nav.url or page.url contains nav.name %} active{% endif %}" href="{{ nav.url | relative_url }}">{{ nav.label | default: nav.name | capitalize }}</a>
        </li>
        {% endfor %}
      </ul>
      <div class="nav-actions d-flex align-items-center">
        <a class="nav-github" href="{{ site.links.github }}"><i class="fa-brands fa-github" aria-hidden="true"></i><span>GitHub</span></a>
        {% if site.dark_mode %}
        <button class="dark-mode-toggle" id="darkModeToggle" aria-label="Switch color theme" title="Switch color theme">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
